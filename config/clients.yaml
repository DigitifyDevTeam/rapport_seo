# One entry per client. Only the sources you fill will be queried; the
# others are skipped gracefully so you can roll out integrations one at a
# time.
#
# Run a report with:
#   python -m src.pipeline.run_monthly --client example --month 2026-03
#   python -m src.pipeline.run_monthly --client deepcleaning --month 2026-04
#   python -m src.pipeline.run_monthly --client origincbd --month 2026-03
#   python -m src.pipeline.run_monthly --client digitify --month 2026-04
#   python -m src.pipeline.run_monthly --client guivarche --month 2026-05
#   python -m src.pipeline.run_monthly --client cchabitat --month 2026-04

defaults:
  agency_name: DIGITIFY
  timezone: Europe/Paris
  currency: EUR

clients:
  - id: cchabitat
    name: CC-Habitat.com
    website: https://www.cc-habitat.com
    # GSC + GMB use cchabitat.seo@gmail.com (not the agency OAuth token).
    google_oauth_account: cchabitat
    report_profile:
      client: CC Habitat
      activity: Habitat, construction & rénovation
      site_name: CC Habitat
      url: https://www.cc-habitat.com/
      seo_pack: Pack PRO +
      seo_since: "—"
    ga4:
      property_id: "339322990"
      organic_channel: "Organic Search"
      ui_charts_dir: scripts/clients/cchabitat/ga4_assets
    gsc:
      site_url: "https://www.cc-habitat.com/"
    gmb:
      account_id: ""
      location_id: ""
      # Google Search / GBP label (site brand: Concept Confort Habitat).
      ui_prefer_gmb_app: true
      ui_project_name: "Concept Confort Habitat"
      ui_search_query: "Concept Confort Habitat couvreur Val-de-Marne"
      ui_project_aliases:
        - "CC Habitat"
        - "Concept Confort Habitat"
    clarity:
      project_id: "ivgh9to4z7"
    delivery:
      emails: []

  - id: digitify
    name: Digitify.fr
    website: https://digitify.fr
    report_profile:
      client: Digitify
      activity: Agence web & marketing digital
      site_name: Digitify
      url: https://digitify.fr/
      seo_pack: Pack PRO +
      seo_since: "—"
    ga4:
      property_id: "366533803"
      organic_channel: "Organic Search"
      ui_charts_dir: scripts/clients/digitify/ga4_assets
    gsc:
      site_url: "https://digitify.fr/"
    gmb:
      account_id: ""
      location_id: ""
      # Same Google account as DeepCleaning — reuse its VPS session (#mpd= URL).
      ui_session_client: deepcleaning
      ui_prefer_gmb_app: true
      ui_project_name: "Digitify"
      ui_search_query: "Digitify"
      ui_project_aliases:
        - "Digitify.fr"
        - "digitify.fr"
    clarity:
      project_id: "wck8kvahx2"
      ui_skip_widgets:
        - popular_products
      pptx_hide_popular_products: true
    delivery:
      emails: []

  - id: guivarche
    name: Guivarche Déménagement
    website: https://guivarche-demenagement.fr
    report_profile:
      client: Guivarche
      activity: Déménagement & services associés
      site_name: Guivarche
      url: https://guivarche-demenagement.fr/
      seo_pack: Pack PRO +
      seo_since: "—"
    ga4:
      property_id: "395375607"
      organic_channel: "Organic Search"
      ui_charts_dir: scripts/clients/guivarche/ga4_assets
    gsc:
      site_url: "https://guivarche-demenagement.fr/"
    gmb:
      account_id: ""
      location_id: ""
      ui_session_client: deepcleaning
      ui_prefer_gmb_app: true
      ui_project_name: "Guivarche"
      ui_search_query: "Guivarche déménagement"
      ui_project_aliases:
        - "Guivarche"
        - "guivarche-demenagement.fr"
    clarity:
      project_id: "k23l3ye7zj"
      ui_skip_widgets:
        - popular_products
      pptx_hide_popular_products: true
    delivery:
      emails: []

  - id: deepcleaning
    name: DeepCleaning.fr
    website: https://deepcleaning.fr
    report_profile:
      client: DeepCleaning
      activity: Nettoyage écologique à domicile (canapés, matelas, tapis)
      site_name: DeepCleaning
      url: https://deepcleaning.fr/
      seo_pack: Pack PRO +
      seo_since: "—"
    ga4:
      property_id: "402338514"
      organic_channel: "Organic Search"
      ui_charts_dir: scripts/clients/deepcleaning/ga4_assets
    gsc:
      site_url: "https://deepcleaning.fr/"
    gmb:
      account_id: ""
      location_id: ""
      # GMB: prepare on Windows (gmb_ui_prepare.py), copy gmb-deepcleaning.json to VPS
      ui_prefer_gmb_app: true
      ui_project_name: "Deep Cleaning"
      ui_search_query: "Deep Cleaning Lavage et nettoyage professionnel Colombes"
      ui_project_aliases:
        - "DeepCleaning"
        - "deepcleaning.fr"
        - "Lavage et nettoyage professionnel"
    clarity:
      project_id: "lfjtuxge3c"
      # No e-commerce: skip Produits populaires widget + PPT column (Origincbd unchanged).
      ui_skip_widgets:
        - popular_products
      pptx_hide_popular_products: true
    delivery:
      emails: []

  - id: origincbd
    name: Origincbd.fr
    website: https://originecbd.fr
    report_profile:
      client: Origine Diffusion
      activity: E-commerce, Boutique CBD
      site_name: Origine CBD
      url: https://originecbd.fr/
      seo_pack: Pack PRO +
      seo_since: Janvier 2021
    ga4:
      property_id: "357892867"
      organic_channel: "Organic Search"
      # Top traffic cards use GA4 Data API (activeUsers) — same metrics as GA4 home.
      use_ui_screenshots: false
    gsc:
      site_url: "https://originecbd.fr/"
    gmb:
      account_id: ""
      location_id: ""
      # Same Google account as DeepCleaning — reuse its VPS session + per-brand Performance URL.
      ui_session_client: deepcleaning
      ui_prefer_gmb_app: true
      ui_project_name: "Origin"
      # Fallback Google Search query if GBP list does not open Performance.
      ui_search_query: "Origine CBD Paris"
      # Used when automated capture saves an organic snippet instead of the panel.
      business_card_reference: scripts/clients/origincbd/gmb_business_card_reference.png
    clarity:
      project_id: "iqfjm1ewdj"
    delivery:
      emails: []

  - id: example
    name: Example Client
    website: https://example.com
    report_profile:
      client: Example Client
      activity: Démo
      site_name: Example
      url: https://example.com
      seo_pack: Pack Standard
      seo_since: "—"
    ga4:
      property_id: "000000000"
      organic_channel: "Organic Search"
      use_ui_screenshots: false
    gsc:
      site_url: "sc-domain:example.com"
    gmb:
      account_id: "accounts/0000000000"
      location_id: "locations/0000000000"
    clarity:
      project_id: ""
    delivery:
      emails: []
