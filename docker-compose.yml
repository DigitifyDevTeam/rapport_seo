services:
  seo-reports:
    build:
      context: .
      dockerfile: Dockerfile
    image: rapport-seo:latest
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    # Headless Chromium (Playwright + Puppeteer)
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

  # Interactive shell for one-time logins (GMB / Clarity sessions)
  seo-tools:
    profiles:
      - tools
    image: rapport-seo:latest
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker-entrypoint.sh"]

  # Browser UI on the VPS (noVNC). Use ONLY for one-time manual login flows.
  # Connect: http://<vps-ip>:7900  (password: vnc)
  seo-vnc:
    profiles:
      - tools
    image: rapport-seo:latest
    working_dir: /app
    env_file:
      - .env
    environment:
      - DISPLAY=:0
    ports:
      - "7900:7900"
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["bash", "/app/scripts/vnc_server.sh"]
