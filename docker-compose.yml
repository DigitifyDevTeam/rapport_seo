services:
  seo-reports:
    build:
      context: .
      dockerfile: Dockerfile
    image: rapport-seo:latest
    # Same as seo-vnc: host network avoids broken Docker outbound on some OVH VPS.
    network_mode: host
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    # Headless Chromium (Playwright + Puppeteer)
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PYTHONPATH=/app

  # Interactive shell for one-time logins (GMB / Clarity sessions)
  seo-tools:
    profiles:
      - tools
    image: rapport-seo:latest
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker-entrypoint.sh"]

  # Browser UI on the VPS (noVNC). Use ONLY for one-time manual login flows.
  # Host network avoids Docker iptables DNAT (broken on some OVH hosts without root).
  # Connect: http://127.0.0.1:7900/vnc.html on the server, or SSH tunnel from your PC.
  # Run as host user (HOST_UID/HOST_GID set by vnc_start.sh) so outputs/ stays writable.
  seo-vnc:
    profiles:
      - tools
    image: rapport-seo:latest
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    network_mode: host
    working_dir: /app
    env_file:
      - .env
    environment:
      - DISPLAY=:99
      - PYTHONPATH=/app
      - SEO_REPORT_VNC=1
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./logs:/app/logs
    shm_size: "2gb"
    init: true
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["bash", "/app/scripts/vnc_server.sh"]
